<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoría de Guitarra Simplificada - Curso Interactivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #0f766e; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Ocultar input radio original y estilizar etiqueta */
        .quiz-option input[type="radio"] { display: none; }
        .quiz-option span {
            display: block;
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quiz-option input[type="radio"]:checked + span {
            border-color: #0d9488;
            background-color: #f0fdfa;
            color: #0f766e;
            font-weight: 600;
        }
        
        /* Sidebar transition para móvil */
        #sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }
        @media (min-width: 768px) {
            .sidebar-closed { transform: translateX(0); } /* Siempre abierto en desktop */
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased overflow-hidden flex h-screen">

    <!-- Sidebar / Índice Lateral -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-teal-900 text-white shadow-xl flex flex-col sidebar-closed md:relative">
        <div class="p-6 border-b border-teal-800 flex justify-between items-center">
            <h1 class="font-bold text-xl leading-tight">Teoría de Guitarra<br><span class="text-teal-300 text-sm font-normal">Curso Interactivo</span></h1>
            <button onclick="toggleSidebar()" class="md:hidden text-teal-200 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto py-4" id="sidebar-nav">
            <!-- Nav items injected via JS -->
        </nav>
        <div class="p-4 border-t border-teal-800 text-xs text-teal-400 text-center">
            Progreso Global
            <div class="w-full bg-teal-950 h-2 rounded-full mt-2 overflow-hidden">
                <div id="sidebar-progress" class="bg-teal-400 h-2 transition-all duration-500" style="width: 0%;"></div>
            </div>
        </div>
    </aside>

    <!-- Overlay para móvil -->
    <div id="mobile-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-30 hidden md:hidden"></div>

    <!-- Contenido Principal -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden">
        
        <!-- Header Móvil & Progreso superior -->
        <header class="bg-white shadow-sm z-20 flex flex-col shrink-0">
            <div class="flex items-center p-4 border-b border-slate-200 md:hidden">
                <button onclick="toggleSidebar()" class="text-slate-500 hover:text-teal-700 mr-4 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h2 class="font-bold text-slate-800 truncate">Teoría de Guitarra</h2>
            </div>
            <!-- Progress Bar Superior -->
            <div class="w-full bg-slate-200 h-1.5 md:h-2">
                <div id="top-progress" class="bg-teal-500 h-full transition-all duration-500" style="width: 0%;"></div>
            </div>
        </header>

        <!-- Área desplazable de contenido -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-12 relative scroll-smooth" id="main-scroll-area">
            <div class="max-w-4xl mx-auto">
                
                <!-- Migas de Pan (Breadcrumbs) -->
                <nav class="mb-6 flex items-center text-sm font-medium text-slate-500" id="breadcrumbs">
                    <!-- Injected via JS -->
                </nav>

                <!-- Contenedor Dinámico -->
                <div id="content-container" class="fade-in">
                    <!-- El contenido se inyecta aquí -->
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Personalizado (Reemplazo de alert) -->
    <div id="custom-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="modal-content-box">
            <div class="p-6 text-center">
                <div id="modal-icon" class="mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4"></div>
                <h3 id="modal-title" class="text-lg leading-6 font-bold text-slate-900 mb-2">Título</h3>
                <div class="mt-2">
                    <p id="modal-message" class="text-sm text-slate-600">Mensaje del modal</p>
                </div>
            </div>
            <div class="bg-slate-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse rounded-b-xl">
                <button type="button" onclick="closeModal()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-teal-600 text-base font-medium text-white hover:bg-teal-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
                    Continuar
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Lógica de la App -->
    <script>
        // --- Base de Datos del Curso ---
        const courseStages = [
            {
                title: "Fundamentos del Piano y la Guitarra",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">El Patrón de 12 Notas</h3>
                    <p class="mb-4">Toda la música occidental se construye utilizando únicamente <strong>12 notas únicas</strong>. En el piano, esto es evidente a través del patrón repetitivo de teclas blancas y negras. El alfabeto musical es: A, B, C, D, E, F, G (La, Si, Do, Re, Mi, Fa, Sol).</p>
                    
                    <img src="assets/piano_vs_guitarra.jpg" onerror="this.src='https://placehold.co/800x300/0d9488/ffffff?text=Patrón+de+12+Notas+y+Piano'" class="w-full rounded-lg my-6 shadow-md" alt="Espacio para gráfico del PDF">

                    <h3 class="text-xl font-bold text-slate-800 mb-2">Tonos y Semitonos</h3>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li><strong>Semitono:</strong> Menor distancia posible. En guitarra, equivale a moverte <strong>un traste</strong>.</li>
                        <li><strong>Tono:</strong> Equivale a dos semitonos (avanzar <strong>dos trastes</strong>).</li>
                    </ul>
                    <p class="bg-teal-50 p-4 rounded-lg border-l-4 border-teal-500 text-teal-800 text-sm">
                        <strong>Tip:</strong> Entre B y C, y entre E y F, solo hay un semitono de distancia natural (sin sostenidos intermedios).
                    </p>
                `,
                quiz: [
                    { q: "¿Cuántas notas únicas componen la escala cromática base de la música?", options: ["7 notas", "12 notas", "24 notas"], correct: 1 },
                    { q: "Avanzar un TONO (Tono entero) en la guitarra equivale a moverse:", options: ["Un traste", "Dos trastes", "A la siguiente cuerda"], correct: 1 }
                ]
            },
            {
                title: "Tonalidades y Escalas",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">¿Qué es una escala?</h3>
                    <p class="mb-4">Una escala es una secuencia de notas que sirve como marco fundamental para componer. Sigue un patrón de <strong>Tonos (W)</strong> y <strong>Semitonos (H)</strong>.</p>
                    
                    <h3 class="text-xl font-bold text-slate-800 mb-2">La Escala Mayor y Menor</h3>
                    <p class="mb-2">La <strong>Escala Mayor</strong> suena alegre. Su fórmula es:</p>
                    <p class="font-mono bg-slate-100 p-2 rounded text-center font-bold tracking-widest mb-4">W - W - H - W - W - W - H</p>
                    <p class="mb-4">La <strong>Escala Menor Natural</strong> tiene un sonido sombrío y su fórmula es: W - H - W - W - H - W - W.</p>

                    <h3 class="text-xl font-bold text-slate-800 mb-2">Escalas Pentatónicas</h3>
                    <p class="mb-4">Son escalas de cinco notas. Se crean eliminando dos notas disonantes de las escalas mayores o menores diatónicas, haciéndolas perfectas para improvisar solos de guitarra sin miedo a equivocarse.</p>
                    <img src="assets/escalas_pdf.jpg" onerror="this.src='https://placehold.co/800x300/0d9488/ffffff?text=Diagramas+de+Escalas'" class="w-full rounded-lg my-6 shadow-md" alt="Gráfico de Escalas">
                `,
                quiz: [
                    { q: "¿Cuál es la fórmula de la Escala Mayor?", options: ["W-H-W-W-H-W-W", "W-W-H-W-W-W-H", "W-W-W-H-W-W-H"], correct: 1 },
                    { q: "¿Cuántas notas tiene una escala pentatónica?", options: ["7 notas", "5 notas", "8 notas"], correct: 1 }
                ]
            },
            {
                title: "Armonía y Acordes",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Construcción de Acordes (Tríadas)</h3>
                    <p class="mb-4">Un acorde se construye sobre una nota fundamental (raíz). Un acorde Mayor se construye con los grados: <strong>1 (Raíz), 3 (Tercera Mayor) y 5 (Quinta)</strong>.</p>
                    
                    <img src="assets/acordes_pdf.jpg" onerror="this.src='https://placehold.co/800x300/0d9488/ffffff?text=Construcción+e+Inversiones'" class="w-full rounded-lg my-6 shadow-md" alt="Gráfico de Acordes">

                    <h3 class="text-xl font-bold text-slate-800 mb-2">Inversiones de Acordes</h3>
                    <p class="mb-4">En guitarra, a menudo cambiamos el orden de las notas. Una <strong>Primera inversión</strong> pone la Tercera en el bajo. Una <strong>Segunda inversión</strong> pone la Quinta en el bajo. Esto facilita transiciones fluidas (voice leading).</p>

                    <h3 class="text-xl font-bold text-slate-800 mb-2">Otros tipos</h3>
                    <p class="mb-4">Además de mayores y menores, existen acordes suspendidos (sus2, sus4) que omiten la tercera, y acordes extendidos (séptimas, novenas) que añaden riqueza a la armonía.</p>
                `,
                quiz: [
                    { q: "Una tríada mayor se forma con los intervalos:", options: ["Raíz, Segunda, Quinta", "Raíz, Tercera Mayor, Quinta", "Raíz, Cuarta, Sexta"], correct: 1 },
                    { q: "Si la TERCERA de un acorde se convierte en la nota más grave (el bajo), se trata de:", options: ["Primera inversión", "Segunda inversión", "Acorde suspendido"], correct: 0 }
                ]
            },
            {
                title: "Sistema CAGED y Círculo de Quintas",
                content: `
                    <h3 class="text-xl font-bold text-slate-800 mb-2">El Sistema CAGED</h3>
                    <p class="mb-4">Divide el diapasón utilizando las 5 formas fundamentales de acordes abiertos: <strong>C, A, G, E y D</strong>. Usando cejillas, estas formas son móviles y se interconectan para mapear todo el mástil, conectando acordes y escalas en una sola estructura lógica.</p>

                    <img src="assets/caged_circulo_pdf.jpg" onerror="this.src='https://placehold.co/800x300/0d9488/ffffff?text=Sistema+CAGED+y+Círculo'" class="w-full rounded-lg my-6 shadow-md" alt="Sistema CAGED">

                    <h3 class="text-xl font-bold text-slate-800 mb-2">El Círculo de Quintas</h3>
                    <p class="mb-4">Es el "mapa definitivo" de la teoría musical. Organiza las tonalidades por intervalos de quintas perfectas. Es útil para:</p>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li>Identificar armaduras (cuántos sostenidos o bemoles tiene una escala).</li>
                        <li>Encontrar tonalidades vecinas para progresiones de acordes suaves.</li>
                        <li>Identificar inmediatamente la tonalidad relativa menor de cualquier clave mayor (ubicada justo debajo en el círculo).</li>
                    </ul>
                `,
                quiz: [
                    { q: "¿Qué formas de acordes abiertos conforman el nombre del sistema CAGED?", options: ["C, A, G, E, D", "F, A, C, E, G", "C, D, E, F, G"], correct: 0 },
                    { q: "¿Para qué sirve principalmente el Círculo de Quintas?", options: ["Para afinar la guitarra", "Para identificar armaduras, relativos menores y tonalidades afines", "Para leer tablaturas"], correct: 1 }
                ]
            }
        ];

        const quotes = [
            "¡Las obras de arte crean reglas; las reglas no crean obras de arte!",
            "¡El conocimiento es poder en tus dedos!",
            "¡Excelente! Estás descifrando la matriz de la música.",
            "¡Muy bien! Un paso más cerca del dominio total del diapasón.",
            "¡Bravo! Sigues desbloqueando la teoría musical."
        ];

        // --- Estado de la App ---
        let currentView = 'intro'; // 'intro', 0, 1, 2, 3, 'completed'
        let maxUnlockedStage = 0; // 0 significa que solo la Etapa 1 (índice 0) está desbloqueada.

        // --- Inicialización ---
        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
        });

        // --- Funciones de Renderizado ---
        
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            let html = `
                <a href="#" onclick="goTo('intro')" class="flex items-center px-6 py-3 transition-colors ${currentView === 'intro' ? 'bg-teal-800 border-l-4 border-teal-400' : 'hover:bg-teal-800/50 border-l-4 border-transparent'}">
                    <svg class="w-5 h-5 mr-3 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Inicio
                </a>
            `;

            courseStages.forEach((stage, index) => {
                const isLocked = index > maxUnlockedStage;
                const isActive = currentView === index;
                
                let icon = '';
                if (isLocked) {
                    icon = `<svg class="w-4 h-4 ml-auto text-teal-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>`;
                } else if (index < maxUnlockedStage || currentView === 'completed') {
                    icon = `<svg class="w-4 h-4 ml-auto text-green-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>`;
                }

                const clickAction = isLocked ? `onclick="showLockedModal()"` : `onclick="goTo(${index})"`;
                const activeClasses = isActive ? 'bg-teal-800 border-l-4 border-teal-400 text-white' : 'hover:bg-teal-800/50 border-l-4 border-transparent text-teal-100';
                const opacityClass = isLocked ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer';

                html += `
                    <a ${clickAction} class="flex items-center px-6 py-3 transition-colors ${activeClasses} ${opacityClass}">
                        <span class="w-6 text-sm font-bold text-teal-500">${index + 1}.</span>
                        <span class="text-sm truncate pr-2">${stage.title}</span>
                        ${icon}
                    </a>
                `;
            });

            const completedActive = currentView === 'completed' ? 'bg-teal-800 border-l-4 border-teal-400' : 'hover:bg-teal-800/50 border-l-4 border-transparent text-teal-100';
            const completedOpacity = maxUnlockedStage >= courseStages.length ? 'cursor-pointer' : 'opacity-50 cursor-not-allowed hidden';
            
            if (maxUnlockedStage >= courseStages.length || currentView === 'completed') {
                html += `
                    <a href="#" onclick="goTo('completed')" class="flex items-center px-6 py-3 mt-4 transition-colors ${completedActive} ${completedOpacity}">
                        <svg class="w-5 h-5 mr-3 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                        Certificado Final
                    </a>
                `;
            }

            nav.innerHTML = html;

            // Actualizar barras de progreso
            let progress = 0;
            if (currentView === 'intro') { progress = 5; }
            else if (currentView === 'completed') { progress = 100; }
            else { progress = Math.max(5, (currentView / courseStages.length) * 100); }
            
            document.getElementById('sidebar-progress').style.width = `${progress}%`;
            document.getElementById('top-progress').style.width = `${progress}%`;
        }

        function renderBreadcrumbs() {
            const bc = document.getElementById('breadcrumbs');
            let html = `<a href="#" onclick="goTo('intro')" class="hover:text-teal-600 hover:underline">Inicio</a>`;
            
            if (typeof currentView === 'number') {
                html += `
                    <svg class="w-4 h-4 mx-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span class="text-slate-800 font-semibold truncate">Etapa ${currentView + 1}: ${courseStages[currentView].title}</span>
                `;
            } else if (currentView === 'completed') {
                html += `
                    <svg class="w-4 h-4 mx-2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    <span class="text-slate-800 font-semibold">Curso Completado</span>
                `;
            }
            bc.innerHTML = html;
        }

        function renderContent() {
            const container = document.getElementById('content-container');
            let html = '';

            if (currentView === 'intro') {
                html = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 md:p-12 text-center">
                        <div class="w-20 h-20 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-bold text-teal-900 mb-4">Bienvenido al Curso</h2>
                        <p class="text-slate-600 mb-8 max-w-2xl mx-auto text-lg leading-relaxed">Basado en el libro <strong>"Teoría de Guitarra Simplificada"</strong>, este curso desmitificará la teoría musical conectando la lógica del piano directamente con el diapasón de tu guitarra. Aprende a tu propio ritmo a través de 4 etapas progresivas.</p>
                        <button onclick="goTo(0)" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-10 rounded-lg shadow-lg hover:shadow-xl transition-all inline-flex items-center text-lg">
                            Comenzar Etapa 1
                            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>
                `;
            } else if (currentView === 'completed') {
                html = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 md:p-12 text-center">
                        <h2 class="text-3xl font-bold text-teal-800 mb-4">¡Felicidades, Eres un Experto!</h2>
                        <p class="text-slate-600 mb-6 max-w-2xl mx-auto text-lg">Has dominado los conceptos fundamentales de la Teoría de Guitarra Simplificada. Ahora posees las herramientas para comprender lo que tocas, armar progresiones con sentido y surcar el diapasón con total libertad armónica.</p>
                        <div class="bg-teal-50 text-teal-800 p-5 rounded-lg font-medium max-w-md mx-auto mb-8 border border-teal-100 italic">
                            "${quotes[0]}"
                        </div>
                        <img src="assets/imagen_pdf_final.jpg" onerror="this.src='https://placehold.co/600x300/0d9488/ffffff?text=Diploma+Virtual'" class="w-full max-w-lg mx-auto rounded-lg shadow-md mb-8" alt="Final">
                        
                        <div class="flex justify-center space-x-4">
                            <button onclick="goTo(3)" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2 px-6 rounded-lg transition-colors">Volver a repasar</button>
                            <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2 px-6 rounded-lg transition-all">Reiniciar Curso</button>
                        </div>
                    </div>
                `;
            } else {
                // Etapas 0 a 3
                const stage = courseStages[currentView];
                const isStagePassed = maxUnlockedStage > currentView;
                
                // Build Quiz HTML
                let quizHtml = '';
                stage.quiz.forEach((q, qIndex) => {
                    let optionsHtml = '';
                    q.options.forEach((opt, oIndex) => {
                        const isChecked = isStagePassed && q.correct === oIndex ? 'checked' : '';
                        optionsHtml += `
                            <label class="quiz-option">
                                <input type="radio" name="q${qIndex}" value="${oIndex}" ${isStagePassed ? 'disabled' : ''} ${isChecked}>
                                <span class="text-sm md:text-base">${opt}</span>
                            </label>
                        `;
                    });
                    quizHtml += `
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 mb-4">
                            <p class="font-semibold text-slate-800 mb-3">${qIndex + 1}. ${q.q}</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${optionsHtml}</div>
                        </div>
                    `;
                });

                html = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 border-b border-slate-200 p-6 md:p-8">
                            <span class="text-teal-600 font-bold tracking-wider text-sm uppercase mb-1 block">Etapa ${currentView + 1} de 4</span>
                            <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900">${stage.title}</h2>
                        </div>
                        
                        <div class="p-6 md:p-8 prose prose-slate max-w-none text-slate-700">
                            ${stage.content}
                        </div>

                        <div class="bg-slate-50 p-6 md:p-8 border-t border-slate-200">
                            <h3 class="text-xl font-bold text-slate-800 mb-2 flex items-center">
                                <svg class="w-6 h-6 mr-2 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Evaluación de la Etapa
                            </h3>
                            <p class="text-sm text-slate-500 mb-6">${isStagePassed ? 'Ya has superado esta evaluación. Puedes revisar tus respuestas correctas.' : 'Responde correctamente para desbloquear la siguiente etapa.'}</p>
                            
                            <div id="quiz-container">
                                ${quizHtml}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Navegación Prev/Next -->
                    <div class="mt-8 flex items-center justify-between">
                        <button onclick="goTo(${currentView - 1})" class="text-slate-600 hover:text-teal-700 font-medium py-2 px-4 rounded-lg transition-colors flex items-center bg-white border border-slate-200 shadow-sm">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            Anterior
                        </button>
                        
                        ${!isStagePassed ? 
                            `<button id="btn-eval" onclick="evaluateStage()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 px-8 rounded-lg shadow-md transition-all">Evaluar para Avanzar</button>` 
                            : 
                            `<button onclick="goTo(${currentView + 1})" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-8 rounded-lg shadow-md transition-all flex items-center">
                                Siguiente Etapa
                                <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>`
                        }
                    </div>
                `;
            }

            container.innerHTML = html;
            renderBreadcrumbs();
            
            // Forzar reflow para animación fade-in
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');
            
            document.getElementById('main-scroll-area').scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Navegación y Lógica ---

        function goTo(target) {
            if (target === -1) target = 'intro';
            if (target === courseStages.length) target = 'completed';
            
            currentView = target;
            renderSidebar();
            renderContent();
            
            // Cerrar sidebar en móvil si está abierta
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('sidebar-open')) {
                toggleSidebar();
            }
        }

        function evaluateStage() {
            const stage = courseStages[currentView];
            const totalQs = stage.quiz.length;
            let correctCount = 0;
            let allAnswered = true;

            for (let i = 0; i < totalQs; i++) {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selected) {
                    allAnswered = false;
                    break;
                }
                if (parseInt(selected.value) === stage.quiz[i].correct) {
                    correctCount++;
                }
            }

            if (!allAnswered) {
                showModal("Faltan respuestas", "Por favor, selecciona una opción en todas las preguntas antes de enviar.", false);
                return;
            }

            if (correctCount === totalQs) {
                // Éxito
                maxUnlockedStage = Math.max(maxUnlockedStage, currentView + 1);
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                showModal("¡Etapa Superada!", randomQuote, true, () => {
                    // Acción al cerrar el modal de éxito: Re-renderizar para mostrar botón Siguiente
                    renderSidebar();
                    renderContent();
                });
            } else {
                // Fallo
                showModal("Hay errores", `Has acertado ${correctCount} de ${totalQs}. Revisa los conceptos de esta etapa e inténtalo de nuevo.`, false);
            }
        }

        // --- Utilidades Móviles ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (sidebar.classList.contains('sidebar-closed')) {
                sidebar.classList.remove('sidebar-closed');
                sidebar.classList.add('sidebar-open');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.remove('sidebar-open');
                sidebar.classList.add('sidebar-closed');
                overlay.classList.add('hidden');
            }
        }

        function showLockedModal() {
            showModal("Etapa Bloqueada", "Debes superar el cuestionario de la etapa anterior para poder acceder a esta lección.", false);
        }

        // --- Modales Custom ---
        let onModalCloseCallback = null;

        function showModal(title, message, isSuccess, callback = null) {
            onModalCloseCallback = callback;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-content-box');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconContainer = document.getElementById('modal-icon');
            if (isSuccess) {
                iconContainer.className = "mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-teal-100 text-teal-600";
                iconContainer.innerHTML = `<svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
            } else {
                iconContainer.className = "mx-auto flex items-center justify-center h-12 w-12 rounded-full mb-4 bg-amber-100 text-amber-600";
                iconContainer.innerHTML = `<svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth; // Force reflow
            modal.classList.remove('opacity-0');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-content-box');
            
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                if (onModalCloseCallback) {
                    onModalCloseCallback();
                    onModalCloseCallback = null;
                }
            }, 300);
        }
    </script>
</body>
</html>
